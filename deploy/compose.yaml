# Rustorr on a server, managed by tools/deploy.sh over SSH. The image is
# loaded by the script (no registry); settings live in .env beside this file,
# the state in the `data` volume, backups in ./backups.
name: rustorr

services:
  rustorr:
    image: ${RUSTORR_IMAGE:?set by tools/deploy.sh}
    restart: unless-stopped
    env_file: .env
    environment:
      RUSTORR_DATA_DIR: /data
      RUSTORR_LISTEN: 0.0.0.0:8090
      RUSTORR_PEER_PORT: ${RUSTORR_PEER_PORT:-6881}
      RUSTORR_LOG_FORMAT: json
    ports:
      # RUSTORR_BIND=127.0.0.1 keeps them for a reverse proxy on this host.
      - "${RUSTORR_BIND:-0.0.0.0}:${RUSTORR_HTTP_PORT:-8090}:8090"
      # Used only with RUSTORR_SSL=true.
      - "${RUSTORR_BIND:-0.0.0.0}:${RUSTORR_HTTPS_PORT:-8091}:8091"
      # Incoming peers: the same port inside and out, as it is announced.
      - "${RUSTORR_PEER_PORT:-6881}:${RUSTORR_PEER_PORT:-6881}/tcp"
      - "${RUSTORR_PEER_PORT:-6881}:${RUSTORR_PEER_PORT:-6881}/udp"
    volumes:
      - data:/data
    # Above RUSTORR_SHUTDOWN_GRACE (5 s by default), so open streams get
    # their grace before Docker kills the process.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
