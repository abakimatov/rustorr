services:
  r6proxy:
    image: nginx:1.27-alpine
    depends_on:
      rustorr:
        condition: service_started
    volumes:
      - ./tools/contract/docker/nginx-rustorr.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RUSTORR_CONTRACT_CERT_DIR:-/tmp/rustorr-contract/certs}:/etc/nginx/certs:ro
    networks: [baseline]
