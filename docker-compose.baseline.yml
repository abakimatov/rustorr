name: rustorr-r1

services:
  fixture:
    build:
      context: .
      dockerfile: tools/baseline/docker/Dockerfile.tooling
    command: ["python3", "/tools/generate-fixtures.py", "/data"]
    volumes:
      - fixture-data:/data
      - ./tools/baseline:/tools:ro
    networks: [baseline]

  tracker:
    build:
      context: .
      dockerfile: tools/baseline/docker/Dockerfile.tracker
    expose: ["6969"]
    depends_on:
      fixture:
        condition: service_completed_successfully
    volumes:
      - fixture-data:/data:ro
    networks: [baseline]

  seeder:
    build:
      context: .
      dockerfile: tools/baseline/docker/Dockerfile.seeder
    depends_on:
      fixture:
        condition: service_completed_successfully
      tracker:
        condition: service_started
    volumes:
      - fixture-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$(transmission-remote 127.0.0.1:9091 --list 2>/dev/null |
          grep -c '100%')" -eq 3
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 3s
    networks: [baseline]

  torrserver:
    build:
      context: .
      dockerfile: tools/baseline/docker/Dockerfile.torrserver
    depends_on:
      tracker:
        condition: service_started
      seeder:
        condition: service_started
    environment:
      TS_PORT: "8090"
      TS_PATH: /config
      # Keep the black-box fixture hermetic. If public-IP discovery succeeds,
      # anacrolix may reject the RFC1918 peer returned by the local tracker as
      # inconsistent with the advertised public address.
      HTTP_PROXY: http://127.0.0.1:9
      HTTPS_PROXY: http://127.0.0.1:9
      NO_PROXY: tracker,seeder,127.0.0.1,localhost
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - torrserver-state:/config
      - fixture-data:/fixtures:ro
    cap_add: [NET_ADMIN]
    networks: [baseline]

networks:
  baseline:
    driver: bridge

volumes:
  fixture-data:
  torrserver-state:
