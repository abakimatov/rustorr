[workspace]
resolver = "3"
members = ["crates/*"]
# The R3 engine spike is an evidence tool with its own pinned lockfile, not
# production code. Without this, cargo would refuse to build it from inside the
# workspace directory tree.
exclude = ["tools/engine-spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
rustorr-domain = { path = "crates/rustorr-domain" }
rustorr-engine = { path = "crates/rustorr-engine" }
rustorr-cache = { path = "crates/rustorr-cache" }
rustorr-state = { path = "crates/rustorr-state" }
rustorr-http = { path = "crates/rustorr-http" }
rustorr-lifecycle = { path = "crates/rustorr-lifecycle" }
rustorr-search = { path = "crates/rustorr-search" }
rustorr-discovery = { path = "crates/rustorr-discovery" }

anyhow = "1"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
librqbit-core = { version = "=9.0.1", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tempfile = "3"
tokio = "1"
tokio-util = { version = "0.7", features = ["io"] }
thiserror = "2"
base64 = "0.22"
bytes = "1"
async-stream = "0.3"
futures-core = "0.3"
httpdate = "1"
ipnet = "2"
mime_guess = "2"
percent-encoding = "2"
flate2 = "1"
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
socket2 = { version = "0.6", features = ["all"] }
nix = { version = "0.30", default-features = false, features = ["net", "user", "hostname"] }
md-5 = "0.10"
rand = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
