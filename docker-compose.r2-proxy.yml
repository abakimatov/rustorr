services:
  r2proxy:
    image: nginx:1.27-alpine
    depends_on:
      torrserver:
        condition: service_started
    ports:
      - "127.0.0.1:8091:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./tools/contract/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${RUSTORR_CONTRACT_CERT_DIR:-/tmp/rustorr-contract/certs}:/etc/nginx/certs:ro
    networks: [baseline]

  r2tls:
    image: rustorr-r1-torrserver
    depends_on:
      tracker:
        condition: service_started
      seeder:
        condition: service_started
    command:
      - --path
      - /tls-config
      - --port
      - "8092"
      - --ssl
      - --sslport
      - "8444"
      - --sslcert
      - /etc/rustorr-certs/server.crt
      - --sslkey
      - /etc/rustorr-certs/server.key
    ports:
      - "127.0.0.1:8092:8092"
      - "127.0.0.1:8444:8444"
    volumes:
      - r2tls-state:/tls-config
      - fixture-data:/fixtures:ro
      - ${RUSTORR_CONTRACT_CERT_DIR:-/tmp/rustorr-contract/certs}:/etc/rustorr-certs:ro
    cap_add: [NET_ADMIN]
    networks: [baseline]

networks:
  baseline:
    name: rustorr-r1_baseline
    external: true

volumes:
  r2tls-state:
    name: rustorr-r2tls-state
