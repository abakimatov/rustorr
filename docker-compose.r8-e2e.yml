# R8 end to end: Rustorr with GStreamer and the web interface on the
# hermetic fixture network, driven by Playwright from the same network. It
# layers over docker-compose.baseline.yml and docker-compose.r2-hermetic.yml;
# `tools/r4.sh e2e` runs it. Rustorr's /data is an anonymous volume, fresh on
# every run, so the contract corpora's state is never touched.
services:
  e2e-seed:
    # The Rutor fixture database: Rustorr reads <data-dir>/rutor.ls and would
    # otherwise try to download it.
    image: rustorr-r1-fixture
    command: ["python3", "/r7/fixtures.py", "/seed"]
    volumes:
      - ./tools/contract/r7:/r7:ro
      - e2e-seed:/seed
    networks: [baseline]

  e2e-rustorr:
    image: rustorr-r8-e2e
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUSTORR_FEATURES: gstreamer
        RUSTORR_BUILD_PACKAGES: libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        RUSTORR_RUNTIME_PACKAGES: >-
          ffmpeg libgstreamer1.0-0 gstreamer1.0-tools gstreamer1.0-plugins-base
          gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
          gstreamer1.0-libav gstreamer1.0-plugins-base-apps
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
      tracker:
        condition: service_started
      seeder:
        condition: service_started
    entrypoint: ["sh", "-c", "cp /seed/rutor.ls /data/rutor.ls && exec rustorr"]
    environment:
      RUSTORR_DISABLE_DHT: "true"
      # The image's user has no home for GStreamer's registry cache.
      GST_REGISTRY: /tmp/rustorr-gstreamer-registry.bin
    volumes:
      - e2e-seed:/seed:ro
      - /data
    networks: [baseline]

  e2e:
    image: rustorr-r8-e2e-runner
    build:
      context: ./tools/r8
      dockerfile: Dockerfile.e2e
    working_dir: /web
    command: ["npx", "playwright", "test", "-c", "e2e/playwright.config.ts"]
    environment:
      RUSTORR_E2E_URL: http://e2e-rustorr:8090
      CI: "1"
    ipc: host
    volumes:
      - ./web:/web
      - rustorr-r8-node-modules:/web/node_modules
      # The fixture .torrent files, for the upload path.
      - fixture-data:/fixtures:ro
    depends_on:
      e2e-rustorr:
        condition: service_started
    networks: [baseline]

volumes:
  e2e-seed:
  rustorr-r8-node-modules:
    external: true
