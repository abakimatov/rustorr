[package]
name = "rustorr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rustorr"
path = "src/main.rs"

[features]
default = ["fuse"]
# The FUSE mount (`--fuse-path`); fuser mounts without libfuse.
fuse = ["dep:rustorr-fuse"]
# The GStreamer HLS module (`/gst`): links libgstreamer, so the binary needs
# GStreamer at run time. The default build answers as a build without it.
gstreamer = ["dep:rustorr-gstreamer", "rustorr-gstreamer/runtime"]
r5-test-control = []

[dependencies]
rustorr-domain.workspace = true
rustorr-engine.workspace = true
rustorr-cache.workspace = true
rustorr-state.workspace = true
rustorr-http.workspace = true
rustorr-lifecycle.workspace = true
rustorr-search.workspace = true
rustorr-discovery.workspace = true
rustorr-fuse = { workspace = true, optional = true }
rustorr-gstreamer = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "ansi"] }
ipnet.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
time.workspace = true

[dev-dependencies]

[lints]
workspace = true
